name: BugFlow Elite v6 — CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run tests daily at 6am to catch any regressions
    - cron: '0 6 * * *'

jobs:

  # ── Tests ──────────────────────────────────────────────────────────────
  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            aiohttp pyyaml python-dotenv APScheduler pytz \
            requests httpx dnspython mmh3 psutil \
            pytest pytest-asyncio pytest-cov respx

      - name: Create required directories
        run: |
          mkdir -p output db config/scope custom-templates
          touch output/.gitkeep custom-templates/.gitkeep

      - name: Run test suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v \
            --tb=short \
            --no-header \
            --cov=modules \
            --cov=config \
            --cov=db \
            --cov-report=term-missing \
            --cov-fail-under=20

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}
          path: htmlcov/
          retention-days: 7

  # ── Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check core modules/scope/scope_enforcer.py modules/recon/bbot_engine.py modules/recon/reconftw_engine.py modules/triage/ai_engine.py tests/test_phase0_contracts.py --select=E,F --ignore=E501,F401,E402

  # ── Security scan ──────────────────────────────────────────────────────
  security:
    name: Secret Scanner
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check no secrets committed
        shell: bash
        run: |
          set -euo pipefail
          # High-confidence credential shapes only. Detector regexes in source code
          # are intentionally not treated as credentials.
          if git grep -nIE '(AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|xoxb-[0-9A-Za-z-]{20,}|sk-[A-Za-z0-9]{20,})' --               '*.py' '*.yaml' '*.yml' '*.json' '*.env' ':!tests/**'; then
            echo "❌ Potential credential-shaped secret found in tracked source."
            exit 1
          fi
          echo "✅ No high-confidence credential-shaped secrets found"

  # ── Docker build check ─────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: |
          docker build -t bugflow-elite:ci \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            .


  # ── Deterministic foundation gates ─────────────────────────────────────
  foundation:
    name: Phase 0 Foundation Gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install foundation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp pyyaml python-dotenv requests httpx dnspython pytest pytest-asyncio pytest-cov respx
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run Phase 0 contract tests
        env:
          PYTHONPATH: .
        run: pytest -o addopts="" tests/test_phase0_contracts.py -q --cov=core.contracts --cov=core.evidence --cov-report=term-missing --cov-fail-under=90


