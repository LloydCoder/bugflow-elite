[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=modules
    --cov=config
    --cov=db
    --cov-report=term-missing
    --cov-fail-under=20
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests requiring external services
log_cli = true
log_cli_level = WARNING
